[project]
name = "visarjan-ghat-watch-backend"
version = "1.0.0"
description = "FastAPI water-quality risk ranking and brief service for Bhopal Durga Visarjan 2026"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pandas>=2.2.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["app*", "analysis*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
