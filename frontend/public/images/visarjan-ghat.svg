<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ghatSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="60%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.7"/>
      <stop offset="40%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="stoneStep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#ghatSky)"/>
  <!-- Distant Ghat Temples and Pillars -->
  <rect x="100" y="160" width="30" height="90" fill="#334155" opacity="0.8"/>
  <polygon points="115,120 90,160 140,160" fill="#1e293b"/>
  <rect x="220" y="180" width="25" height="70" fill="#334155" opacity="0.8"/>
  <polygon points="232,150 210,180 255,180" fill="#1e293b"/>
  <!-- Ghat Stone Steps Descending into Water -->
  <polygon points="0,250 800,250 800,270 0,270" fill="#94a3b8"/>
  <polygon points="0,270 800,270 800,295 0,295" fill="#64748b"/>
  <polygon points="0,295 800,295 800,325 0,325" fill="#475569"/>
  <polygon points="0,325 800,325 800,360 0,360" fill="#334155"/>
  <!-- Lake Water with Ripples -->
  <rect x="0" y="360" width="800" height="140" fill="url(#water)"/>
  <!-- Ceremonial Diya / Marigold Petals floating -->
  <circle cx="280" cy="385" r="5" fill="#f59e0b"/>
  <circle cx="360" cy="405" r="4" fill="#ef4444"/>
  <circle cx="490" cy="390" r="6" fill="#f59e0b"/>
  <circle cx="580" cy="415" r="4.5" fill="#f97316"/>
  <!-- Festive Barricade & Lamp Posts -->
  <line x1="50" y1="200" x2="50" y2="360" stroke="#f59e0b" stroke-width="3"/>
  <line x1="750" y1="200" x2="750" y2="360" stroke="#f59e0b" stroke-width="3"/>
  <circle cx="50" cy="200" r="8" fill="#fbbf24"/>
  <circle cx="750" cy="200" r="8" fill="#fbbf24"/>
  <text x="400" y="80" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="20" opacity="0.9">VISARJAN GHAT MONITORING SITE</text>
  <text x="400" y="110" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="13">Bhopal Municipal Corporation · Idol Immersion Inspection</text>
</svg>