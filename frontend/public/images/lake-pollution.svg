<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="riskSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="riskWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#riskSky)"/>
  <rect x="0" y="270" width="800" height="230" fill="url(#riskWater)"/>
  <!-- Warning Wave Lines -->
  <path d="M 0 290 Q 200 320 400 290 T 800 290" stroke="#ef4444" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M 0 330 Q 200 360 400 330 T 800 330" stroke="#f59e0b" stroke-width="2.5" fill="none" opacity="0.5"/>
  <!-- Critical DO / High BOD Indicator Icon -->
  <polygon points="400,160 435,225 365,225" fill="#ef4444" stroke="#fecaca" stroke-width="2"/>
  <text x="400" y="215" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="20">!</text>
  <text x="400" y="80" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="20">ENVIRONMENTAL RISK & DEOXYGENATION</text>
  <text x="400" y="110" text-anchor="middle" fill="#fca5a5" font-family="sans-serif" font-size="13">High BOD Organic Loading & Acute Oxygen Deficit Area</text>
</svg>